<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة المنزل - نيكاي</title>
<style>
:root{
  --bg:#0b1220; --card:#121b2e; --card2:#182540; --fg:#eef3fb; --muted:#9fb0cc;
  --ok:#49d888; --warn:#f0b24a; --bad:#ff6b6b; --accent:#5aa0ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;direction:rtl;height:100%;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{height:100vh;display:flex;flex-direction:column}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);flex-wrap:wrap}
#top .logo{font-size:22px;font-weight:bold;color:var(--accent)}
#top .clock{margin-right:auto;color:var(--muted);font-size:18px}
#top button{background:var(--card2);color:var(--fg);border:0;border-radius:10px;padding:10px 16px;font-size:18px}
#top button.active{background:var(--accent);color:#06101f;font-weight:bold}

/* country chips */
#chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;background:#0e1626;white-space:nowrap}
#chips button{background:var(--card2);color:var(--muted);border:0;border-radius:20px;padding:8px 14px;font-size:15px;flex:0 0 auto}
#chips button.active{background:var(--accent);color:#06101f}

/* grid */
#grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ch{background:var(--card);border-radius:14px;padding:16px;text-align:center;border:2px solid transparent}
.ch:hover,.ch:focus{border-color:var(--accent);outline:none}
.ch .nm{font-size:18px;font-weight:bold}
.ch .cc{color:var(--muted);font-size:13px;margin-top:4px}

/* player */
#player{position:fixed;inset:0;background:#000;display:none;z-index:50}
#player video{width:100%;height:100%}
#player #pbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 20px;background:linear-gradient(#000a,transparent)}
#player #pname{font-size:22px}
#player #pclose{background:#ffffff22;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:18px}

/* panel (pin/settings/smart home) */
.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:60}
.panel{background:var(--card);border-radius:18px;padding:28px;width:min(92vw,480px);max-height:88vh;overflow:auto}
.panel h2{margin:0 0 14px;font-size:24px}
.panel .sub{color:var(--muted);font-size:15px;margin-bottom:16px}
.panel input{width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:14px;border-radius:10px;border:0;background:var(--card2);color:var(--fg);margin-bottom:12px}
.panel button.go{width:100%;background:var(--accent);color:#06101f;font-weight:bold;border:0;border-radius:10px;padding:14px;font-size:18px;margin-top:4px}
.panel .msg{min-height:22px;color:var(--warn);font-size:14px;text-align:center;margin-top:6px}
.panel .row2{display:flex;gap:10px;margin-top:14px}
.panel .row2 button{flex:1;background:var(--card2);color:var(--fg);border:0;border-radius:10px;padding:12px}
.device{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:12px;padding:14px;margin-bottom:10px}
.device .name{font-size:17px}
.device .state{font-size:13px;color:var(--muted)}
.toggle{width:50px;height:28px;border-radius:14px;background:#2a3550;position:relative;border:0}
.toggle.on{background:var(--ok)}
.toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on .knob{left:25px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo">شاشة المنزل</div>
    <div class="clock" id="clock"></div>
    <button data-cat="general">عام</button>
    <button data-cat="news">أخبار</button>
    <button data-cat="sport">رياضة</button>
    <button data-cat="kids">أطفال</button>
    <button data-cat="music">موسيقى</button>
    <button data-cat="quran">قرآن</button>
    <button id="btnSmart">المنزل الذكي</button>
    <button id="btnSettings">⚙ الإعدادات</button>
  </div>
  <div id="chips"></div>
  <div id="grid"></div>
</div>

<div id="player">
  <div id="pbar"><div id="pname"></div><button id="pclose">إغلاق ✕</button></div>
  <video id="vid" controls autoplay playsinline></video>
</div>

<!-- PIN gate -->
<div class="overlay" id="pinOverlay">
  <div class="panel">
    <h2 id="pinTitle">رمز الحماية</h2>
    <div class="sub" id="pinSub"></div>
    <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="go" id="pinGo">تأكيد</button>
    <div class="msg" id="pinMsg"></div>
  </div>
</div>

<!-- Settings panel -->
<div class="overlay" id="setOverlay">
  <div class="panel">
    <h2>الإعدادات</h2>
    <div class="sub">إعدادات الربط بالخادم (لمرة واحدة فقط)</div>
    <div class="sub">رابط الخادم</div>
    <input id="relayUrl" style="font-size:16px;letter-spacing:0;text-align:left;direction:ltr" placeholder="https://your-relay.workers.dev">
    <div class="sub">رمز العائلة السري</div>
    <input id="famCode" style="font-size:20px;letter-spacing:4px" placeholder="رمز العائلة">
    <button class="go" id="saveRelay">حفظ</button>
    <div class="row2">
      <button id="changePin">تغيير رمز الحماية</button>
      <button id="closeSettings">إغلاق</button>
    </div>
  </div>
</div>

<!-- Smart home panel -->
<div class="overlay" id="smartOverlay">
  <div class="panel">
    <h2>المنزل الذكي</h2>
    <div class="sub" id="smartSub">هذه الميزة تحتاج ربط حساب Tuya أولاً من الإعدادات</div>
    <div id="smartList"></div>
    <div class="row2"><button id="closeSmart">إغلاق</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="channels.js"></script>
<script>
/* ---------- storage helpers ---------- */
function LS_get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function LS_set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function LS_json(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function LS_setj(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- clock ---------- */
function tickClock(){
  var d=new Date();
  document.getElementById('clock').textContent=d.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock,10000); tickClock();

/* ================= PIN security (hash + lockout + forced setup) ================= */
function pinHash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0}return 'h'+h}
function pinWeak(p){
  if(p.length<4) return true;
  if(/^(\d)\1+$/.test(p)) return true;
  if(['1234','4321','0000','1212','2580','1111','2222','3333'].indexOf(p)>=0) return true;
  return false;
}
function pinFS(){return LS_json('fh_pinf',{n:0,u:0})}
function pinLockLeft(){var f=pinFS();var left=f.u-Date.now();return left>0?left:0}
function pinRecordFail(){
  var f=pinFS(); f.n=(f.n||0)+1;
  if(f.n>=3){ var wait=Math.min(3600000,60000*Math.pow(2,f.n-3)); f.u=Date.now()+wait; }
  LS_setj('fh_pinf',f);
}
function pinClearFail(){LS_setj('fh_pinf',{n:0,u:0})}

var pinState={stage:0, tmp:'', onOk:null}; // stage: 0 normal verify, 1 choose new, 2 confirm new

function pinShow(onOk){
  pinState.onOk=onOk;
  var hash=LS_get('fh_pinh','');
  pinState.stage = hash? 0 : 1;
  pinRenderHead();
  document.getElementById('pinInput').value='';
  document.getElementById('pinMsg').textContent='';
  document.getElementById('pinOverlay').style.display='flex';
  setTimeout(function(){document.getElementById('pinInput').focus()},50);
}
function pinRenderHead(){
  var t=document.getElementById('pinTitle'), s=document.getElementById('pinSub');
  var left=pinLockLeft();
  if(left>0){ t.textContent='مقفل مؤقتاً'; s.textContent='حاول مرة أخرى بعد '+Math.ceil(left/1000)+' ثانية'; return }
  if(pinState.stage===1){ t.textContent='إنشاء رمز حماية جديد'; s.textContent='اختر رمزاً من 4 أرقام على الأقل (ليس 1234 أو متكرر)'; }
  else if(pinState.stage===2){ t.textContent='تأكيد الرمز'; s.textContent='أدخل الرمز مرة أخرى للتأكيد'; }
  else { t.textContent='رمز الحماية'; s.textContent='أدخل الرمز للدخول إلى الإعدادات أو المنزل الذكي'; }
}
function pinSubmit(){
  var left=pinLockLeft();
  if(left>0){ pinRenderHead(); return }
  var v=document.getElementById('pinInput').value.trim();
  var msg=document.getElementById('pinMsg');
  if(!v){return}
  if(pinState.stage===1){
    if(pinWeak(v)){ msg.textContent='هذا الرمز ضعيف جداً، اختر رمزاً آخر'; document.getElementById('pinInput').value=''; return }
    pinState.tmp=v; pinState.stage=2; pinRenderHead(); document.getElementById('pinInput').value=''; msg.textContent=''; return
  }
  if(pinState.stage===2){
    if(v!==pinState.tmp){ msg.textContent='الرمزان غير متطابقين، حاول من جديد'; pinState.stage=1; pinState.tmp=''; pinRenderHead(); document.getElementById('pinInput').value=''; return }
    LS_set('fh_pinh', pinHash(v)); pinClearFail();
    document.getElementById('pinOverlay').style.display='none';
    if(pinState.onOk) pinState.onOk();
    return
  }
  // stage 0: verify
  var hash=LS_get('fh_pinh','');
  if(pinHash(v)===hash){
    pinClearFail();
    document.getElementById('pinOverlay').style.display='none';
    if(pinState.onOk) pinState.onOk();
  } else {
    pinRecordFail();
    var left2=pinLockLeft();
    if(left2>0){ pinRenderHead(); }
    else { msg.textContent='رمز غير صحيح'; }
    document.getElementById('pinInput').value='';
  }
}
document.getElementById('pinGo').addEventListener('click',pinSubmit);
document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter')pinSubmit()});

function pinForceChange(){
  LS_set('fh_pinh','');
  pinShow(function(){ document.getElementById('setOverlay').style.display='flex' });
}

/* ================= channels UI ================= */
var CATS={general:'عام',news:'أخبار',sport:'رياضة',kids:'أطفال',music:'موسيقى',quran:'قرآن'};
var curCat='general', curCountry='all';

function countryName(c){return (CH_DB.countries[c])||c}

function renderChips(){
  var cat=CH_DB.categories[curCat]||[];
  var ccs={}; cat.forEach(function(c){ccs[c.c]=true});
  var html='<button data-cc="all" class="'+(curCountry==='all'?'active':'')+'">الكل</button>';
  Object.keys(ccs).sort(function(a,b){ return (a==='om'?-1:b==='om'?1:countryName(a).localeCompare(countryName(b))) })
   .forEach(function(c){html+='<button data-cc="'+c+'" class="'+(curCountry===c?'active':'')+'">'+countryName(c)+'</button>'});
  document.getElementById('chips').innerHTML=html;
}
function renderGrid(){
  var list=(CH_DB.categories[curCat]||[]).filter(function(c){return curCountry==='all'||c.c===curCountry});
  var html='';
  list.forEach(function(c,i){
    html+='<div class="ch" tabindex="0" data-i="'+i+'"><div class="nm">'+c.n+'</div><div class="cc">'+countryName(c.c)+'</div></div>';
  });
  if(!list.length) html='<div style="color:var(--muted);padding:40px;text-align:center">لا توجد قنوات في هذا التصنيف</div>';
  document.getElementById('grid').innerHTML=html;
  document.getElementById('grid').scrollTop=0;
  Array.prototype.forEach.call(document.querySelectorAll('.ch'),function(el){
    el.addEventListener('click',function(){ playChannel(list[+el.dataset.i]) });
    el.addEventListener('keydown',function(e){if(e.key==='Enter')playChannel(list[+el.dataset.i])});
  });
}
function setCat(cat){
  curCat=cat; curCountry='all';
  Array.prototype.forEach.call(document.querySelectorAll('#top button[data-cat]'),function(b){
    b.classList.toggle('active', b.dataset.cat===cat);
  });
  renderChips(); renderGrid();
}
document.getElementById('chips').addEventListener('click',function(e){
  var b=e.target.closest('button[data-cc]'); if(!b)return;
  curCountry=b.dataset.cc; renderChips(); renderGrid();
});
Array.prototype.forEach.call(document.querySelectorAll('#top button[data-cat]'),function(b){
  b.addEventListener('click',function(){setCat(b.dataset.cat)});
});

/* ================= player (hls.js) ================= */
var hlsInst=null;
function playChannel(c){
  if(!c) return;
  document.getElementById('pname').textContent=c.n;
  var v=document.getElementById('vid');
  document.getElementById('player').style.display='block';
  if(hlsInst){hlsInst.destroy();hlsInst=null}
  if(window.Hls && Hls.isSupported()){
    hlsInst=new Hls({enableWorker:true});
    hlsInst.loadSource(c.u);
    hlsInst.attachMedia(v);
    hlsInst.on(Hls.Events.ERROR,function(ev,data){ if(data.fatal){ document.getElementById('pname').textContent=c.n+' — تعذر تشغيل هذه القناة الآن'; } });
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=c.u;
  } else {
    document.getElementById('pname').textContent=c.n+' — المتصفح لا يدعم هذا النوع من البث';
  }
}
document.getElementById('pclose').addEventListener('click',function(){
  var v=document.getElementById('vid'); v.pause(); v.removeAttribute('src'); v.load();
  if(hlsInst){hlsInst.destroy();hlsInst=null}
  document.getElementById('player').style.display='none';
});

/* ================= settings (relay url + family code) ================= */
document.getElementById('btnSettings').addEventListener('click',function(){
  pinShow(function(){
    document.getElementById('relayUrl').value=LS_get('fh_relay','');
    document.getElementById('famCode').value=LS_get('fh_code','');
    document.getElementById('setOverlay').style.display='flex';
  });
});
document.getElementById('closeSettings').addEventListener('click',function(){document.getElementById('setOverlay').style.display='none'});
document.getElementById('saveRelay').addEventListener('click',function(){
  LS_set('fh_relay', document.getElementById('relayUrl').value.trim());
  LS_set('fh_code', document.getElementById('famCode').value.trim());
  document.getElementById('setOverlay').style.display='none';
});
document.getElementById('changePin').addEventListener('click',function(){
  document.getElementById('setOverlay').style.display='none';
  pinForceChange();
});

/* ================= smart home (Tuya placeholder) ================= */
document.getElementById('btnSmart').addEventListener('click',function(){
  pinShow(function(){
    var relay=LS_get('fh_relay',''); var code=LS_get('fh_code','');
    var box=document.getElementById('smartList');
    if(!relay||!code){
      document.getElementById('smartSub').textContent='أدخل رابط الخادم ورمز العائلة من الإعدادات أولاً، ثم زوّدني ببيانات حساب Tuya لتفعيل الأجهزة الذكية.';
      box.innerHTML='';
    } else {
      document.getElementById('smartSub').textContent='لم يتم ربط أي جهاز ذكي حتى الآن. أرسل لي بيانات حساب Tuya Cloud (Access ID/Secret) وأسماء الأجهزة لتفعيل هذه القائمة.';
      box.innerHTML='';
    }
    document.getElementById('smartOverlay').style.display='flex';
  });
});
document.getElementById('closeSmart').addEventListener('click',function(){document.getElementById('smartOverlay').style.display='none'});

/* ================= init ================= */
setCat('general');
</script>
</body>
</html>
